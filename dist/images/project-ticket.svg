<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#161616"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="140" height="400" fill="#1a1a1a"/>
  <rect x="20" y="20" width="100" height="10" rx="5" fill="#f7c843"/>
  <rect x="20" y="20" width="40" height="10" rx="5" fill="#f7c843"/>
  <!-- Nav items -->
  <rect x="20" y="60" width="100" height="36" rx="8" fill="#252525"/>
  <rect x="35" y="72" width="70" height="6" rx="3" fill="#555"/>
  <rect x="20" y="108" width="100" height="36" rx="8" fill="#f7c843" opacity="0.15"/>
  <rect x="35" y="120" width="70" height="6" rx="3" fill="#f7c843"/>
  <circle cx="28" cy="126" r="4" fill="#f7c843"/>
  <rect x="20" y="156" width="100" height="36" rx="8" fill="#252525"/>
  <rect x="35" y="168" width="70" height="6" rx="3" fill="#555"/>
  <rect x="20" y="204" width="100" height="36" rx="8" fill="#252525"/>
  <rect x="35" y="216" width="70" height="6" rx="3" fill="#555"/>

  <!-- Header -->
  <rect x="160" y="16" width="120" height="10" rx="5" fill="#f7c843"/>
  <rect x="160" y="34" width="80" height="6" rx="3" fill="#444"/>

  <!-- Stats cards row -->
  <!-- Card 1 - Total tickets -->
  <rect x="160" y="60" width="120" height="70" rx="10" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="175" y="75" width="40" height="6" rx="3" fill="#555"/>
  <rect x="175" y="92" width="60" height="16" rx="4" fill="#f7c843"/>
  <rect x="175" y="110" width="50" height="4" rx="2" fill="#444"/>

  <!-- Card 2 - Open -->
  <rect x="290" y="60" width="120" height="70" rx="10" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="305" y="75" width="30" height="6" rx="3" fill="#555"/>
  <rect x="305" y="92" width="40" height="16" rx="4" fill="#4fc3f7"/>
  <circle cx="370" cy="100" r="4" fill="#4fc3f7"/>
  <rect x="305" y="110" width="50" height="4" rx="2" fill="#444"/>

  <!-- Card 3 - Urgent -->
  <rect x="420" y="60" width="120" height="70" rx="10" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="435" y="75" width="35" height="6" rx="3" fill="#555"/>
  <rect x="435" y="92" width="30" height="16" rx="4" fill="#ff5252"/>
  <circle cx="500" cy="100" r="4" fill="#ff5252"/>
  <rect x="435" y="110" width="50" height="4" rx="2" fill="#444"/>

  <!-- Section title -->
  <rect x="160" y="150" width="90" height="8" rx="4" fill="#f7c843"/>
  <rect x="160" y="164" width="60" height="5" rx="2.5" fill="#444"/>

  <!-- Ticket list -->
  <!-- Ticket item 1 - urgent -->
  <rect x="160" y="184" width="380" height="44" rx="8" fill="#1e1e1e"/>
  <rect x="160" y="184" width="4" height="44" rx="2" fill="#ff5252"/>
  <rect x="178" y="194" width="60" height="8" rx="4" fill="#f7c843"/>
  <rect x="178" y="208" width="140" height="6" rx="3" fill="#555"/>
  <rect x="460" y="196" width="50" height="20" rx="4" fill="#ff5252" opacity="0.2"/>
  <rect x="466" y="203" width="38" height="6" rx="3" fill="#ff5252"/>
  <circle cx="508" cy="212" r="3" fill="#ff5252"/>

  <!-- Ticket item 2 - high -->
  <rect x="160" y="236" width="380" height="44" rx="8" fill="#1e1e1e"/>
  <rect x="160" y="236" width="4" height="44" rx="2" fill="#f7c843"/>
  <rect x="178" y="246" width="100" height="8" rx="4" fill="#ddd"/>
  <rect x="178" y="260" width="120" height="6" rx="3" fill="#555"/>
  <rect x="460" y="248" width="50" height="20" rx="4" fill="#f7c843" opacity="0.2"/>
  <rect x="466" y="255" width="38" height="6" rx="3" fill="#f7c843"/>
  <circle cx="500" cy="260" r="3" fill="#f7c843"/>

  <!-- Ticket item 3 - medium -->
  <rect x="160" y="288" width="380" height="44" rx="8" fill="#1e1e1e"/>
  <rect x="160" y="288" width="4" height="44" rx="2" fill="#4fc3f7"/>
  <rect x="178" y="298" width="80" height="8" rx="4" fill="#ddd"/>
  <rect x="178" y="312" width="100" height="6" rx="3" fill="#555"/>
  <rect x="460" y="300" width="50" height="20" rx="4" fill="#4fc3f7" opacity="0.15"/>
  <rect x="466" y="307" width="38" height="6" rx="3" fill="#4fc3f7"/>

  <!-- Ticket item 4 - low -->
  <rect x="160" y="340" width="380" height="44" rx="8" fill="#1e1e1e"/>
  <rect x="160" y="340" width="4" height="44" rx="2" fill="#888"/>
  <rect x="178" y="350" width="90" height="8" rx="4" fill="#ddd"/>
  <rect x="178" y="364" width="110" height="6" rx="3" fill="#555"/>
  <rect x="460" y="352" width="50" height="20" rx="4" fill="#666" opacity="0.2"/>
  <rect x="466" y="359" width="38" height="6" rx="3" fill="#666"/>
</svg>
