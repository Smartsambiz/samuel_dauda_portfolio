  <rect x="210" y="108" width="20" height="14" rx="2" fill="#f7c843" opacity="0.5"/>
  <circle cx="220" cy="115" r="5" fill="#161616" opacity="0.15"/>

  <!-- Income/Expense cards -->
  <rect x="300" y="76" width="130" height="64" rx="12" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="312" y="88" width="40" height="6" rx="3" fill="#555"/>
  <rect x="312" y="102" width="50" height="12" rx="3" fill="#4caf50"/>
  <rect x="312" y="120" width="30" height="4" rx="2" fill="#444"/>

  <rect x="450" y="76" width="130" height="64" rx="12" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="462" y="88" width="40" height="6" rx="3" fill="#555"/>
  <rect x="462" y="102" width="50" height="12" rx="3" fill="#ff5252"/>
