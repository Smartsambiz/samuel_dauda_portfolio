  <rect x="0" y="376" width="600" height="24" fill="#1a1a1a"/>
  <circle cx="80" cy="388" r="4" fill="#f7c843"/>
  <circle cx="200" cy="388" r="4" fill="#444"/>
  <circle cx="320" cy="388" r="4" fill="#444"/>
  <circle cx="440" cy="388" r="4" fill="#444"/>
  <circle cx="540" cy="388" r="4" fill="#444"/>
