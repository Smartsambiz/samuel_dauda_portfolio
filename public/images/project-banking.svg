  <rect x="20" y="236" width="380" height="144" rx="12" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="34" y="248" width="80" height="8" rx="4" fill="#f7c843"/>
  <!-- Chart bars -->
  <rect x="50" y="340" width="24" height="30" rx="4" fill="#f7c843" opacity="0.3"/>
  <rect x="86" y="320" width="24" height="50" rx="4" fill="#f7c843" opacity="0.3"/>
  <rect x="122" y="300" width="24" height="70" rx="4" fill="#f7c843"/>
  <rect x="158" y="310" width="24" height="60" rx="4" fill="#f7c843" opacity="0.3"/>
  <rect x="194" y="280" width="24" height="90" rx="4" fill="#f7c843"/>
  <rect x="230" y="330" width="24" height="40" rx="4" fill="#f7c843" opacity="0.3"/>
  <rect x="266" y="290" width="24" height="80" rx="4" fill="#f7c843"/>
