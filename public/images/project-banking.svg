  <!-- Quick transfer -->
  <rect x="300" y="152" width="280" height="64" rx="12" fill="#1e1e1e" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="312" y="164" width="60" height="6" rx="3" fill="#555"/>
  <!-- Avatar circles -->
  <circle cx="320" cy="190" r="14" fill="#2a2a2a"/>
  <circle cx="320" cy="190" r="6" fill="#f7c843"/>
  <circle cx="352" cy="190" r="14" fill="#2a2a2a"/>
  <circle cx="352" cy="190" r="6" fill="#4fc3f7"/>
  <circle cx="384" cy="190" r="14" fill="#2a2a2a"/>
  <circle cx="384" cy="190" r="6" fill="#ff5252"/>
  <circle cx="416" cy="190" r="14" fill="#2a2a2a"/>
  <circle cx="416" cy="190" r="6" fill="#aaa"/>
  <circle cx="448" cy="190" r="14" fill="#2a2a2a"/>
  <rect x="454" y="187" width="8" height="6" rx="2" fill="#666"/>

