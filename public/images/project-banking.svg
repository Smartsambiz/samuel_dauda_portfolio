  <rect x="434" y="270" width="40" height="40" rx="8" fill="#2a2a2a"/>
  <rect x="444" y="280" width="20" height="20" rx="4" fill="#4caf50"/>
  <rect x="482" y="280" width="70" height="6" rx="3" fill="#555"/>
  <rect x="482" y="292" width="50" height="5" rx="2.5" fill="#444"/>
  <rect x="550" y="280" width="20" height="8" rx="4" fill="#4caf50"/>

  <rect x="434" y="322" width="40" height="40" rx="8" fill="#2a2a2a"/>
  <rect x="444" y="332" width="20" height="20" rx="4" fill="#ff5252"/>
  <rect x="482" y="332" width="60" height="6" rx="3" fill="#555"/>
  <rect x="482" y="344" width="40" height="5" rx="2.5" fill="#444"/>
  <rect x="550" y="332" width="20" height="8" rx="4" fill="#ff5252"/>

