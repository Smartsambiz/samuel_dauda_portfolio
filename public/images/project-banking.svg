<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#161616"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="56" fill="#1a1a1a"/>
  <rect x="20" y="20" width="80" height="8" rx="4" fill="#f7c843"/>
  <circle cx="560" cy="24" r="10" fill="#2a2a2a"/>
  <circle cx="560" cy="24" r="4" fill="#f7c843"/>

  <!-- Balance Card -->
  <rect x="20" y="76" width="260" height="140" rx="16" fill="#f7c843"/>
  <rect x="30" y="86" width="60" height="6" rx="3" fill="#161616" opacity="0.3"/>
  <rect x="30" y="100" width="100" height="20" rx="4" fill="#161616"/>
  <rect x="30" y="126" width="70" height="6" rx="3" fill="#161616" opacity="0.4"/>
  <rect x="30" y="140" width="50" height="6" rx="3" fill="#161616" opacity="0.3"/>
  <!-- Card chip -->
  <rect x="200" y="100" width="40" height="30" rx="4" fill="#161616" opacity="0.15"/>
